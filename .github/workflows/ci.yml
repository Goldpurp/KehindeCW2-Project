name: Coursework verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:prod
      - run: npm run lint
      - run: npm run build

  azure-functions:
    name: Azure Functions policy tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/azure/functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/azure/functions/package-lock.json
      - run: npm ci
      - run: npm run audit:prod
      - run: npm run verify
