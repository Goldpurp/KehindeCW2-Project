services:
  - type: web
    name: kehinde-scalable-solution
    runtime: static
    repo: https://github.com/Goldpurp/kehindeScalableSolution
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_AZURE_API_BASE_URL
        value: https://kehinde-scalable-solution-api.azurewebsites.net/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
